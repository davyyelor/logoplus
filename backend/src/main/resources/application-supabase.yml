# ---------------------------------------------------------------------------
# Supabase profile — primary PostgreSQL database.
#
# Flyway owns the schema `app` (creates/updates the tables) and Hibernate only
# validates it (ddl-auto=validate). Credentials are injected from environment
# variables and are NEVER stored in this repository.
#
# Required environment variables (see .env.example):
#   SUPABASE_DB_URL       e.g. jdbc:postgresql://db.<ref>.supabase.co:5432/postgres?sslmode=require&currentSchema=app
#   SUPABASE_DB_USERNAME  e.g. postgres
#   SUPABASE_DB_PASSWORD  your Supabase database password (never commit it)
#
# Activate with SPRING_PROFILES_ACTIVE=supabase (or let the app auto-detect it
# when the SUPABASE_DB_* variables are present and reachable).
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Short timeout so an unreachable Supabase fails fast (and the fallback
      # logic can react) instead of hanging on startup.
      connection-timeout: 10000
      initialization-fail-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: app
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: Europe/Madrid
  flyway:
    enabled: true
    schemas: app
    default-schema: app
    create-schemas: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false

app:
  # Demo data seeding is OFF by default against a real database. Enable it
  # deliberately with APP_SEED_DEMO_DATA=true only for a throwaway environment.
  seed-demo-data: ${APP_SEED_DEMO_DATA:false}
