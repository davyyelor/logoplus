server:
  port: 8080

# ---------------------------------------------------------------------------
# Base configuration shared by every profile.
#
# Database selection:
#   * Supabase PostgreSQL is the primary database (profile `supabase`).
#   * H2 in-memory is the local/dev/test fallback (profile `h2`, also the
#     default when no Supabase configuration is present).
#
# The active database is chosen automatically at startup by
# `DatabaseFallbackEnvironmentPostProcessor`:
#   1. Supabase configured (SUPABASE_DB_URL/USERNAME/PASSWORD) and reachable
#      -> `supabase` profile (Flyway + ddl-auto=validate on schema `app`).
#   2. Supabase not configured -> H2 (this file's defaults / `h2` profile).
#   3. Supabase configured but unreachable:
#        - APP_DB_FALLBACK_TO_H2=true  -> H2 fallback (local/dev only).
#        - APP_DB_FALLBACK_TO_H2=false -> startup fails with a clear error.
#
# You can also force a profile explicitly with SPRING_PROFILES_ACTIVE=supabase
# or SPRING_PROFILES_ACTIVE=h2. No real credentials are ever stored here.
# ---------------------------------------------------------------------------
spring:
  application:
    name: billing-backend
  # Default datasource is H2 in-memory. The `supabase` profile overrides it.
  datasource:
    url: jdbc:h2:mem:billingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

# Application-wide configuration for the V1 modules.
app:
  security:
    jwt:
      # Local-only development secret. Override via APP_SECURITY_JWT_SECRET in
      # any shared/production environment. Must be at least 32 bytes.
      secret: ${APP_SECURITY_JWT_SECRET:local-dev-secret-change-me-please-32bytes-min!!}
      expiration-minutes: 480
  storage:
    # Local filesystem storage root for uploaded documents. Swappable for S3
    # later via the StoragePort abstraction.
    local-root: ${APP_STORAGE_LOCAL_ROOT:./data/uploads}
    max-file-size-bytes: 26214400
    allowed-content-types: >-
      application/pdf,image/png,image/jpeg,image/gif,image/webp,
      audio/mpeg,audio/wav,audio/ogg,video/mp4,video/webm,
      application/msword,
      application/vnd.openxmlformats-officedocument.wordprocessingml.document,
      text/plain
  seed-demo-data: ${APP_SEED_DEMO_DATA:true}

  # V2 external integrations. All disabled by default; they never contact
  # external services unless explicitly enabled with valid credentials.
  stripe:
    mode: ${STRIPE_MODE:disabled}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    platform-fee-percent: ${STRIPE_PLATFORM_FEE_PERCENT:0}
  calendar:
    provider: ${CALENDAR_PROVIDER:disabled}
    google-client-id: ${GOOGLE_CALENDAR_CLIENT_ID:}
    google-client-secret: ${GOOGLE_CALENDAR_CLIENT_SECRET:}
    outlook-client-id: ${OUTLOOK_CALENDAR_CLIENT_ID:}
    outlook-client-secret: ${OUTLOOK_CALENDAR_CLIENT_SECRET:}
  # Electronic signature provider. `internal-basic` (default) is the built-in
  # simple signature; `advanced-disabled` is a placeholder for an external
  # qualified-signature integration that is intentionally disabled.
  signature:
    provider: ${SIGNATURE_PROVIDER:internal-basic}

# Billing module configuration.
# Future third-party integrations are disabled in this MVP. They are wired as
# placeholders only and never call real external APIs while disabled.
billing:
  default-clinic-id: clinic-default
  default-currency: EUR
  seed-sample-data: true
  integrations:
    holded:
      enabled: false
    quipu:
      enabled: false
    stripe:
      enabled: false
    ticketbai:
      enabled: false
    verifactu:
      enabled: false
