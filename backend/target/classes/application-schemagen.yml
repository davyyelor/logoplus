server:
  port: 0

spring:
  application:
    name: billing-backend-schemagen
  datasource:
    url: jdbc:h2:mem:schemagen;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      jakarta:
        persistence:
          schema-generation:
            scripts:
              action: create
              create-target: target/generated-schema.sql
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        hbm2ddl:
          delimiter: ;
  flyway:
    enabled: false
  h2:
    console:
      enabled: false

app:
  seed-demo-data: false

billing:
  seed-sample-data: false
