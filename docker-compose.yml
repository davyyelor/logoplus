# ==========================================================================
# DEPRECATED / LEGACY — local PostgreSQL for development only.
#
# The application now uses Supabase PostgreSQL as its primary database and
# H2 in-memory as the local/test fallback (see README and backend/.env.example).
# Docker is NO LONGER required to run or develop LogoPlus.
#
# This file is kept only for teams that still prefer a self-hosted local
# PostgreSQL. It is not referenced by the app profiles anymore. To use it,
# rename it back to docker-compose.yml and point SUPABASE_DB_URL at it.
# ==========================================================================
services:
  postgres:
    image: postgres:16-alpine
    container_name: clinic-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Madrid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
